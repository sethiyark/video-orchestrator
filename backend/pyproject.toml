[project]
name = "video-orchestrator"
version = "0.1.0"
description = "Local video production pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "huggingface-hub>=0.34,<1",
    "pyyaml>=6,<7",
    "filelock>=3.16,<4",
    "temporalio>=1.9,<2",
    "redis>=5,<6",
    "minio>=7.2,<8",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3.35,<0.4"]
audio = [
    "kokoro>=0.9.4,<1",
    "soundfile>=0.13,<1",
    "faster-whisper>=1.2,<2",
    "qwen-tts>=0.1,<1",
    "ctc-forced-aligner>=1.0,<2",
    # spaCy English package Kokoro's phonemizer loads (runtime.py); not on PyPI.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
embeddings = ["sentence-transformers>=5,<6"]
images = ["diffusers>=0.35,<0.36", "transformers>=4.51,<5", "accelerate>=1.7,<2", "safetensors>=0.5,<1", "torch>=2.6,<3", "gguf>=0.10,<1", "sentencepiece>=0.2,<1", "protobuf>=4,<7"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
