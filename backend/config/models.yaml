# Model weights are fetched explicitly with: python -m app.models.cli download ROLE
# Pin revision to a Hub commit for deployment. Downloads record the resolved commit.
# This file is the CPU-portable default used by tests. Hardware profiles:
#   MODEL_CONFIG=config/models.mac.yaml       Apple Silicon (Metal), SDXL-Turbo images
#   MODEL_CONFIG=config/models.cuda-8gb.yaml  16 GB RAM + 8 GB NVIDIA, images on
models:
  fast:
    runtime: llama_cpp
    repo_id: Qwen/Qwen3-4B-GGUF
    revision: main
    files: [Qwen3-4B-Q4_K_M.gguf]
    filename: Qwen3-4B-Q4_K_M.gguf
    device: cpu
    gpu_layers: 0
    max_tokens: 2048
    priority: 20
  quality:
    runtime: llama_cpp
    # Opt-in alternative (supported by llama-cpp-python >= 0.3.35; text-only, skip mmproj*):
    #   repo_id: unsloth/Qwen3.5-9B-GGUF, files: [Qwen3.5-9B-Q4_K_M.gguf]
    repo_id: Qwen/Qwen3-8B-GGUF
    revision: main
    files: [Qwen3-8B-Q4_K_M.gguf]
    filename: Qwen3-8B-Q4_K_M.gguf
    device: cpu
    gpu_layers: 0
    context_size: 16384
    max_tokens: 4096
    priority: 10
    timeout_seconds: 1800
  narration:
    runtime: kokoro
    repo_id: hexgrad/Kokoro-82M
    files: [config.json, kokoro-v1_0.pth, voices/af_heart.pt]
    filename: kokoro-v1_0.pth
    voice: af_heart
    device: cpu
  alignment:
    runtime: whisper
    # Low-RAM option: Systran/faster-whisper-small (same files).
    repo_id: deepdml/faster-whisper-large-v3-turbo-ct2
    files: [config.json, model.bin, tokenizer.json, vocabulary.json, preprocessor_config.json]
    device: cpu
  embeddings:
    runtime: sentence_transformers
    repo_id: Qwen/Qwen3-Embedding-0.6B
    files: ["*.json", "*.txt", "*.safetensors", "1_Pooling/*"]
    device: cpu
  images:
    runtime: diffusers_gguf
    repo_id: city96/FLUX.1-schnell-gguf
    files: [flux1-schnell-Q4_K_S.gguf]
    filename: flux1-schnell-Q4_K_S.gguf
    extra_repos:
      - name: text_encoder
        repo_id: city96/t5-v1_1-xxl-encoder-gguf
        files: [t5-v1_1-xxl-encoder-Q5_K_M.gguf]
        filename: t5-v1_1-xxl-encoder-Q5_K_M.gguf
      - name: base
        repo_id: black-forest-labs/FLUX.1-schnell
        files: ["*.json", "tokenizer/*", "tokenizer_2/*", "text_encoder/*.safetensors", "vae/*.safetensors", "scheduler/*"]
    device: cuda
    steps: 4
    priority: 40
    timeout_seconds: 1200
routes:
  research: fast
  verification: quality
  outline: quality
  script: quality
  critique: quality
  storyboard: quality
  # "manual": relay image prompts through your own Claude/Gemini chat and
  # upload the results (no GPU needed); "images" runs the local model.
  assets: manual
  narration: narration
  alignment: alignment
  similarity: embeddings
  metadata: fast
images_enabled: false
governor:
  max_attempts: 3
  critique_rounds: 3
  critic_temperature: 0.3
  min_script_score: 8.5
  max_rewinds: 2
  min_research_confidence: 0.9
  max_similarity: 0.9
  max_images: 120
  min_narration_fidelity: 0.85
