# Model weights are fetched explicitly with: python -m app.models.cli download ROLE
# Pin revision to a Hub commit for deployment. Downloads record the resolved commit.
# CPU is the portable default. On the Linux GPU host set device: cuda and gpu_layers: -1
# for the two GGUF roles after installing a CUDA build of llama-cpp-python.
models:
  fast:
    runtime: llama_cpp
    repo_id: bartowski/HuggingFaceTB_SmolLM3-3B-GGUF
    revision: main
    files: [HuggingFaceTB_SmolLM3-3B-Q4_K_M.gguf]
    filename: HuggingFaceTB_SmolLM3-3B-Q4_K_M.gguf
    device: cpu
    gpu_layers: 0
    max_tokens: 2048
    priority: 20
  quality:
    runtime: llama_cpp
    repo_id: Qwen/Qwen3-8B-GGUF
    revision: main
    files: [Qwen3-8B-Q4_K_M.gguf]
    filename: Qwen3-8B-Q4_K_M.gguf
    device: cpu
    gpu_layers: 0
    max_tokens: 4096
    priority: 10
    timeout_seconds: 1800
  narration:
    runtime: kokoro
    repo_id: hexgrad/Kokoro-82M
    files: [config.json, kokoro-v1_0.pth, voices/af_heart.pt]
    filename: kokoro-v1_0.pth
    voice: af_heart
    device: cpu
  alignment:
    runtime: whisper
    repo_id: Systran/faster-whisper-small
    files: [config.json, model.bin, tokenizer.json, vocabulary.txt, preprocessor_config.json]
    device: cpu
  embeddings:
    runtime: sentence_transformers
    repo_id: sentence-transformers/all-MiniLM-L6-v2
    files: ["*.json", "*.txt", "*.safetensors", "1_Pooling/*"]
    device: cpu
  images:
    runtime: diffusers
    repo_id: stabilityai/stable-diffusion-xl-base-1.0
    files: ["*.json", "*.txt", "*.fp16.safetensors"]
    device: cuda
    priority: 40
    timeout_seconds: 1200
routes:
  research: fast
  verification: quality
  outline: quality
  script: quality
  critique: quality
  storyboard: quality
  assets: images
  narration: narration
  alignment: alignment
  similarity: embeddings
  metadata: fast
images_enabled: false
governor:
  max_attempts: 3
  min_script_score: 8.5
  min_research_confidence: 0.9
  max_similarity: 0.9
  max_images: 3
