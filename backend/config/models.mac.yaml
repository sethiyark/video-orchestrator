# Apple Silicon profile: MODEL_CONFIG=config/models.mac.yaml
# Requires the Metal wheel of llama-cpp-python (see README). Images use SDXL-Turbo
# on MPS; FLUX GGUF stays on the CUDA profile.
models:
  fast:
    runtime: llama_cpp
    repo_id: Qwen/Qwen3-4B-GGUF
    revision: main
    files:
    - Qwen3-4B-Q4_K_M.gguf
    filename: Qwen3-4B-Q4_K_M.gguf
    device: metal
    gpu_layers: -1
    max_tokens: 2048
    priority: 20
  quality:
    runtime: llama_cpp
    repo_id: Qwen/Qwen3-8B-GGUF
    revision: main
    files:
    - Qwen3-8B-Q4_K_M.gguf
    filename: Qwen3-8B-Q4_K_M.gguf
    device: metal
    gpu_layers: -1
    context_size: 16384
    max_tokens: 4096
    priority: 10
    timeout_seconds: 1800
  narration:
    runtime: kokoro
    repo_id: hexgrad/Kokoro-82M
    files:
    - config.json
    - kokoro-v1_0.pth
    - voices/af_heart.pt
    filename: kokoro-v1_0.pth
    voice: af_heart
    device: metal
  alignment:
    runtime: whisper
    repo_id: deepdml/faster-whisper-large-v3-turbo-ct2
    files:
    - config.json
    - model.bin
    - tokenizer.json
    - vocabulary.json
    - preprocessor_config.json
    device: cpu
  embeddings:
    runtime: sentence_transformers
    repo_id: Qwen/Qwen3-Embedding-0.6B
    files:
    - '*.json'
    - '*.txt'
    - '*.safetensors'
    - 1_Pooling/*
    device: cpu
  images:
    runtime: diffusers
    repo_id: stabilityai/sdxl-turbo
    files:
    - '*.json'
    - scheduler/*
    - text_encoder/*
    - text_encoder_2/*
    - tokenizer/*
    - tokenizer_2/*
    - unet/*
    - vae/*
    device: metal
    steps: 4
    priority: 40
    timeout_seconds: 1200
routes:
  research: fast
  verification: quality
  outline: quality
  script: quality
  critique: quality
  storyboard: quality
  assets: images
  narration: narration
  alignment: alignment
  similarity: embeddings
  metadata: fast
images_enabled: true
governor:
  max_attempts: 3
  critique_rounds: 3
  critic_temperature: 0.3
  min_script_score: 8.5
  max_rewinds: 5
  min_research_confidence: 0.9
  max_similarity: 0.9
  max_images: 30
  min_narration_fidelity: 0.85
