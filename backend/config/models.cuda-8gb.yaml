# 16 GB RAM + 8 GB NVIDIA profile: MODEL_CONFIG=config/models.cuda-8gb.yaml
# Needs a CUDA build of llama-cpp-python and the audio + images extras.
# Measure VRAM/RSS on the host; drop the FLUX transformer to Q3_K_S if RAM is short.
models:
  fast:
    runtime: llama_cpp
    repo_id: Qwen/Qwen3-4B-GGUF
    revision: main
    files:
    - Qwen3-4B-Q4_K_M.gguf
    filename: Qwen3-4B-Q4_K_M.gguf
    device: cuda
    gpu_layers: -1
    max_tokens: 2048
    priority: 20
  quality:
    runtime: llama_cpp
    repo_id: Qwen/Qwen3-8B-GGUF
    revision: main
    files:
    - Qwen3-8B-Q4_K_M.gguf
    filename: Qwen3-8B-Q4_K_M.gguf
    device: cuda
    gpu_layers: -1
    max_tokens: 4096
    priority: 10
    timeout_seconds: 1800
    context_size: 12288
  narration:
    runtime: qwen_tts
    repo_id: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
    files:
    - '*.json'
    - '*.safetensors'
    - '*.txt'
    - '*.model'
    speaker: Ryan
    device: cuda
    priority: 30
  alignment:
    runtime: ctc_aligner
    repo_id: MahmoudAshraf/mms-300m-1130-forced-aligner
    files:
    - '*.json'
    - '*.safetensors'
    - '*.txt'
    device: cpu
  embeddings:
    runtime: sentence_transformers
    repo_id: Qwen/Qwen3-Embedding-0.6B
    files:
    - '*.json'
    - '*.txt'
    - '*.safetensors'
    - 1_Pooling/*
    device: cpu
  images:
    runtime: diffusers_gguf
    repo_id: city96/FLUX.1-schnell-gguf
    files:
    - flux1-schnell-Q4_K_S.gguf
    filename: flux1-schnell-Q4_K_S.gguf
    extra_repos:
    - name: text_encoder
      repo_id: city96/t5-v1_1-xxl-encoder-gguf
      files:
      - t5-v1_1-xxl-encoder-Q5_K_M.gguf
      filename: t5-v1_1-xxl-encoder-Q5_K_M.gguf
    - name: base
      repo_id: black-forest-labs/FLUX.1-schnell
      files:
      - '*.json'
      - tokenizer/*
      - tokenizer_2/*
      - text_encoder/*.safetensors
      - vae/*.safetensors
      - scheduler/*
    device: cuda
    steps: 4
    priority: 40
    timeout_seconds: 1200
routes:
  research: fast
  verification: quality
  outline: quality
  script: quality
  critique: quality
  storyboard: quality
  assets: images
  narration: narration
  alignment: alignment
  similarity: embeddings
  metadata: fast
images_enabled: true
governor:
  max_attempts: 3
  critique_rounds: 3
  critic_temperature: 0.3
  min_script_score: 8.5
  max_rewinds: 2
  min_research_confidence: 0.9
  max_similarity: 0.9
  max_images: 3
  min_narration_fidelity: 0.85
